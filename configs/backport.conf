# Per-project backport settings for `dev backport` and `dev pr`.
# Format: org/repo|label_source|label_prefix|branch_template|closes
#   label_source     where the backport labels live: issue (the PR's closing
#                    issue) or pr (the PR itself)
#   label_prefix     a <prefix><MAJOR.MINOR> label names a target branch; the
#                    prefix is stripped to get the version (backport/26.8 -> 26.8)
#   branch_template  the git branch for a version, %s is the version
#                    (release/%s -> release/26.8)
#   closes           yes to add a "* closes: <issue-url>" line to the PR body
keycloak/keycloak|issue|backport/|release/%s|yes
quarkusio/quarkus|pr|triage/backport-|%s|no
