# Format: org/repo|source_dir|ram_mib|cpus|disk_gib
# source_dir is relative to DEV_SOURCES_DIR (from config.local) unless absolute.
#
# Template detection (first match wins):
#   1. Explicit: dev <github-url> → org/repo from URL
#   2. cwd: dev new <name> from inside ~/sources/<source_dir> → matching template
#   3. Name heuristic: dev new <name> → longest repo name that matches <name> or <name>-*
#   4. DEFAULT: fallback when nothing matches
keycloak/keycloak|keycloak|12288|6|20
keycloak/keycloak-client|keycloak-client|4096|4|10
quarkusio/quarkus|quarkus|16384|8|30
apache/camel-k|camel-k|8192|4|15
# Default (when no match):
DEFAULT||8192|4|15
