# Format: org/repo|source_dir|ram_mib|cpus|disk_gib|profiles
# source_dir is relative to DEV_SOURCES_DIR (from config.local) unless absolute.
# profiles: comma-separated list controlling runtime behavior
#   java  — Maven cache overlay from host, SDKMAN environment
#   go    — GOPATH/GOBIN environment
#   kind  — auto-create Kind cluster with local registry on first start
#   study — study project, no git and no GitHub: key study/<name>, source_dir
#           relative to DEV_EDUCATION_DIR (default ~/education). The directory
#           is the material, read-only at /workspace/<name>; `dev .` inside it
#           creates/enters container <name> (see README, Study projects)
#
# Template detection (first match wins):
#   1. Explicit: dev <github-url> → org/repo from URL
#   2. cwd: dev new <name> from inside ~/sources/<source_dir> → matching template
#   3. Name heuristic: dev new <name> → longest repo name that matches <name> or <name>-*
#   4. DEFAULT: fallback when nothing matches
keycloak/keycloak|keycloak|12288|6|20|java
keycloak/keycloak-client|keycloak-client|4096|4|10|java
quarkusio/quarkus|quarkus|16384|8|30|java
michalvavrik/ai-sandboxing|sandboxing|4096|4|10|java
# Study projects (disk_gib: only what the agents make — the material is not copied):
study/psychology|psychology|4096|4|10|study
# Default (when no match):
DEFAULT||8192|4|15|java
